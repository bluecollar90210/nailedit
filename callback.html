<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>NailedIt – Connecting Spotify...</title>
  <style>
    body{margin:0;background:#0d0d1a;display:flex;align-items:center;justify-content:center;height:100vh;font-family:Inter,sans-serif;color:#fff;}
    .msg{text-align:center;}
    .logo{font-size:28px;font-weight:900;margin-bottom:16px;}
    .logo span{color:#ff3cac;}
    .sub{font-size:14px;color:#888;}
    .spin{width:32px;height:32px;border:3px solid #333;border-top-color:#1db954;border-radius:50%;animation:spin .7s linear infinite;margin:16px auto;}
    @keyframes spin{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
<div class="msg">
  <div class="logo">Nailed<span>It</span> 🎤</div>
  <div class="spin"></div>
  <div class="sub" id="status">Connecting Spotify...</div>
</div>
<script>
const CLIENT_ID = 'cab68b24f5ed48b7aaaf0dd8f8654e10';
const REDIRECT_URI = 'https://nailedittunes.netlify.app/callback.html';

async function handleCallback() {
  const params = new URLSearchParams(window.location.search);
  const code = params.get('code');
  const error = params.get('error');

  if (error || !code) {
    document.getElementById('status').textContent = 'Login cancelled. Redirecting...';
    setTimeout(() => window.location.href = '/', 1200);
    return;
  }

  const verifier = sessionStorage.getItem('sp_verifier');
  if (!verifier) {
    document.getElementById('status').textContent = 'Session expired. Try again.';
    setTimeout(() => window.location.href = '/', 1500);
    return;
  }

  try {
    const r = await fetch('https://accounts.spotify.com/api/token', {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: new URLSearchParams({
        grant_type: 'authorization_code',
        code,
        redirect_uri: REDIRECT_URI,
        client_id: CLIENT_ID,
        code_verifier: verifier
      })
    });

    const data = await r.json();

    if (data.access_token) {
      const exp = Date.now() + data.expires_in * 1000;
      localStorage.setItem('sp_token', data.access_token);
      localStorage.setItem('sp_expiry', String(exp));
      if (data.refresh_token) localStorage.setItem('sp_refresh', data.refresh_token);
      document.getElementById('status').textContent = 'Spotify connected! Redirecting...';
      setTimeout(() => window.location.href = '/', 600);
    } else {
      document.getElementById('status').textContent = 'Could not connect. Try again.';
      setTimeout(() => window.location.href = '/', 1500);
    }
  } catch(e) {
    document.getElementById('status').textContent = 'Something went wrong. Redirecting...';
    setTimeout(() => window.location.href = '/', 1500);
  }
}

handleCallback();
</script>
</body>
</html>
